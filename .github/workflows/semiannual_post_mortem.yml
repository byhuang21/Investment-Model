name: Semi-Annual Post-Mortem Calibration

on:
  workflow_dispatch:
  schedule:
    # Jan 15 & Jul 15 at 12:00 UTC
    - cron: "0 12 15 1,7 *"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  post-mortem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Run Semi-Annual Post-Mortem
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/5_post_mortem.py

      - name: Refresh static web snapshot & validate integrity
        run: |
          python scripts/export_web_snapshot.py
          python scripts/doctor.py

      - name: Open sync Pull Request if reports or proposals changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain memory/ web/data/snapshot.json)" ]; then
            echo "No changes to sync."
            exit 0
          fi
          BRANCH="bot/post-mortem-sync"
          git config user.name "coffee-can-bot[bot]"
          git config user.email "coffee-can-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add memory/ web/data/snapshot.json
          git commit -m "chore(bot): semi-annual post-mortem report ($(date -u +%Y-%m-%d))"
          git push --force origin "$BRANCH"
          OPEN_PRS=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$OPEN_PRS" = "0" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(bot): semi-annual post-mortem & calibration review" \
              --body "Automated semi-annual post-mortem. Any rules.yaml proposals are isolated under memory/quarantine/proposals/ for human review."
          else
            echo "Open sync PR already exists and has been updated."
          fi
