name: Daily Watchlist Monitor

on:
  workflow_dispatch:
  schedule:
    # Mon-Fri 22:00 UTC (after US market close)
    - cron: "0 22 * * 1-5"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  watchlist-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Run Near-Miss Watchlist Monitor
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/3_watchlist_monitor.py

      - name: Refresh static web snapshot & validate integrity
        run: |
          python scripts/export_web_snapshot.py
          python scripts/doctor.py

      - name: Open sync Pull Request if memory changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain memory/ web/data/snapshot.json)" ]; then
            echo "No changes to sync."
            exit 0
          fi
          BRANCH="bot/daily-watchlist-sync"
          git config user.name "coffee-can-bot[bot]"
          git config user.email "coffee-can-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add memory/ web/data/snapshot.json
          git commit -m "chore(bot): daily watchlist monitor sync ($(date -u +%Y-%m-%d))"
          git push --force origin "$BRANCH"
          OPEN_PRS=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$OPEN_PRS" = "0" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(bot): daily watchlist monitor sync" \
              --body "Automated daily update from scripts/3_watchlist_monitor.py (validated by doctor.py)."
          else
            echo "Open sync PR already exists and has been updated."
          fi
