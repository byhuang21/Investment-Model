name: Weekly Topic Radar & Earnings Diff

on:
  workflow_dispatch:
  schedule:
    # Every Sunday 14:00 UTC
    - cron: "0 14 * * 0"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  weekly-research-loops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Run Layer 1 Topic Radar
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/1_topic_radar.py --discover

      - name: Run Quarterly Earnings Diff Check
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/4_earnings_diff.py

      - name: Refresh static web snapshot & validate integrity
        run: |
          python scripts/export_web_snapshot.py
          python scripts/doctor.py

      - name: Open sync Pull Request if memory changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain memory/ web/data/snapshot.json)" ]; then
            echo "No changes to sync."
            exit 0
          fi
          BRANCH="bot/weekly-research-sync"
          git config user.name "coffee-can-bot[bot]"
          git config user.email "coffee-can-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add memory/ web/data/snapshot.json
          git commit -m "chore(bot): weekly topic radar & earnings diff sync ($(date -u +%Y-%m-%d))"
          git push --force origin "$BRANCH"
          OPEN_PRS=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$OPEN_PRS" = "0" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(bot): weekly radar & earnings diff sync" \
              --body "Automated weekly scan from scripts/1_topic_radar.py and scripts/4_earnings_diff.py (validated by doctor.py)."
          else
            echo "Open sync PR already exists and has been updated."
          fi
